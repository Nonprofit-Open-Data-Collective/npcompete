url: https://nonprofit-open-data-collective.github.io/npcompete/
destination: docs

# The NODC site style (colours, fonts, navbar, light/dark switch) comes from
# the pkgstyle template package. Do not add bslib settings or
# pkgdown/extra.css here unless this site needs to differ.
template:
  package: pkgstyle

home:
  title: "npcompete: Competition Metrics for Nonprofit Markets"

navbar:
  structure:
    left: [intro, reference, articles, news]

articles:
- title: Metrics
  navbar: Metrics
  contents:
  - hhi
  - concentration-ratios
  - kwoka
  - gini
  - density
- title: Building metrics
  navbar: Building metrics
  contents:
  - build-from-archive
  - build-from-nccs
- title: Comparing metrics
  navbar: Comparing metrics
  contents:
  - metric-correlations

reference:
- title: All metrics at once
  desc: Compute every competition metric for each market in one call.
  contents:
  - get_all_metrics
- title: Building from the local archive
  desc: Convert the SOI panel to a Parquet archive and build metrics for any set of years.
  contents:
  - npc_build_metrics
  - npc_compute_metrics
  - npc_metrics
  - npc_build_archive
  - npc_archive_dir
  - npc_archive_info
  - npc_get_orgs
  - npc_get_population
  - npc_standardize
- title: Building from NCCS downloads
  desc: Download NCCS CORE and BMF files, harmonize them to the archive layout, and check them against the archive.
  contents:
  - npc_build_nccs
  - npc_cache_dir
  - npc_nccs_download
  - npc_match_county
  - npc_compare_sources
- title: Registered and grassroots universes
  desc: Every organization on the IRS registry, including 990-N filers and non-filers.
  contents:
  - npc_build_registered
  - npc_registry_spans
  - get_grassroots_share
- title: Concentration
  desc: How resources are shared among the organizations in a market.
  contents:
  - get_hhi
  - get_nhhi
  - get_cr
  - get_cr_all
  - get_kwoka
  - get_gini
- title: Density
  desc: Nonprofits per capita, overall and by size or type.
  contents:
  - get_scale_free_density
  - starts_with("get_density")
- title: Efficiency
  contents:
  - get_fundraising_efficiency
  - get_fundraising_ratio
  - get_commercial_share
- title: Utilities
  contents:
  - check_year_completeness
  - get_median_age
- title: Data
  desc: Sample organizations and population counts used by the examples.
  contents:
  - npo_panel_sample
  - cbsa_metrics
  - nonprofit_sample
  - county_population
  - pop_county
  - pop_cbsa
  - cbsa_county_xwalk
